# EdgeVision default experiment configuration
#
# This file is the single source of default values. It is loaded and
# validated by edgevision.config; check it with:
#
#     python -m edgevision.config configs/default.yaml
#
# Every section and field is required; use null where a value is "not set".
# Unknown fields are rejected so that typos are caught early.
#
# Currently used: the `model` section supplies defaults for
# scripts/detect_image.py and scripts/detect_video.py, and the `video` section
# (input, max_frames) and the `tracking` section for scripts/detect_video.py.
# The other sections are validated but not yet used (export, output, benchmarking).

model:
  name: yolov8n
  weights: models/yolov8n.pt        # downloaded locally; not committed
  onnx_path: models/yolov8n.onnx    # produced by the export step; not committed
  input_size: 640                   # square model input, pixels
  conf_threshold: 0.25
  iou_threshold: 0.7                # NMS IoU threshold
  classes: null                     # null = all classes; or a list of class IDs

export:
  opset: null                       # to be chosen and documented with the export step
  dynamic_shapes: false
  validate: true                    # compare ONNX outputs against PyTorch

video:
  input: data/input/sample.mp4
  max_frames: 300                   # null = whole video

tracking:
  enabled: false                    # detect_video.py --tracking / --no-tracking overrides this
  tracker: bytetrack

output:
  dir: results
  overwrite: false                  # never silently replace earlier results

benchmark:
  backends: [pytorch, onnx_cpu]     # also planned: onnx_cuda (only if the CUDA EP is available)
  device: auto                      # auto | cpu | cuda; a requested device is never silently changed
  scopes: [model_only, end_to_end]
  warmup: 20
  frames: 300
  runs: 3
  batch_size: 1
  precision: fp32
