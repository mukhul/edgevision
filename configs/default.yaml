# EdgeVision default experiment configuration
#
# This file is the single source of default values. It is loaded and
# validated by edgevision.config; check it with:
#
#     python -m edgevision.config configs/default.yaml
#
# Every section and field is required; use null where a value is "not set".
# Unknown fields are rejected so that typos are caught early.
#
# Currently used: the `model` section supplies defaults for the detection,
# export and benchmark scripts; `video` and `tracking` for
# scripts/detect_video.py (`video.input` also for scripts/benchmark.py);
# `export` for scripts/export_onnx.py; `benchmark` for scripts/benchmark.py.
# The `output` section is validated but not yet used.

model:
  name: yolov8n
  weights: models/yolov8n.pt        # downloaded locally; not committed
  onnx_path: models/yolov8n.onnx    # written by export_onnx.py, read by --backend onnx; not committed
  input_size: 640                   # square model input, pixels
  conf_threshold: 0.25
  iou_threshold: 0.7                # NMS IoU threshold
  classes: null                     # null = all classes; or a list of class IDs

export:
  opset: null                       # null = Ultralytics picks the best for the installed PyTorch/ONNX (18 with PyTorch 2.14)
  dynamic_shapes: false
  validate: true                    # structural ONNX check after export (not a numerical comparison)

video:
  input: data/input/sample.mp4
  max_frames: 300                   # null = whole video

tracking:
  enabled: false                    # detect_video.py --tracking / --no-tracking overrides this
  tracker: bytetrack

output:
  dir: results
  overwrite: false                  # never silently replace earlier results

benchmark:                          # defaults for scripts/benchmark.py (batch size 1, FP32 only)
  scope: detector                   # detector = detect() on frames already in memory; pipeline = decode + detect (+ track)
  device: auto                      # auto | cpu | cuda; a requested device is never silently changed
  warmup: 20                        # iterations per run that are run but excluded from the statistics
  iterations: 300                   # measured iterations (frames) per run
  runs: 3                           # independent runs, each with a freshly loaded model
  preload_frames: 32                # distinct video frames kept in memory for the detector scope
