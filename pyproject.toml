[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgevision"
dynamic = ["version"]   # read from edgevision.__version__ (single source of truth)
description = "Video perception pipeline and reproducible PyTorch vs ONNX Runtime inference benchmarking (early development)."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Only what the implemented code needs. Heavy ML packages (PyTorch, ONNX
# Runtime, OpenCV, Ultralytics) are deliberately NOT mandatory: the
# environment report treats them as optional and they will be added, with
# CPU and GPU variants kept separate, in the stages that actually use them.
dependencies = [
    "pyyaml>=6.0.1,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "numpy>=1.26",   # tests build synthetic image frames
]
# Video decoding. We use the regular opencv-python package because Ultralytics
# (the `detector` extra) requires exactly that distribution. Never install
# opencv-python-headless alongside it: both provide the same `cv2` module and
# overwrite each other's files. 4.10.0.84 is the first release built for
# NumPy 2; 4.13.0.90 is excluded by Ultralytics; OpenCV 5 is capped out until
# it has been tested with Ultralytics.
vision = [
    "opencv-python>=4.10.0.84,!=4.13.0.90,<5",
]
# Pretrained YOLO detection with PyTorch. On Windows and macOS the default
# PyPI torch wheel is CPU-only; on Linux it is a large CUDA build (see README
# for installing the CPU build instead). No CUDA-specific build is pinned.
# Weights are NOT downloaded at install time: an official model such as
# yolov8n.pt is fetched by Ultralytics the first time a detector loads it.
detector = [
    "ultralytics>=8.4,<9",
    "torch>=2.2,<3",
]
# Multi-object tracking with Ultralytics' ByteTrack. Ultralytics needs `lap`
# for matching and would otherwise pip-install it silently at runtime the
# first time a tracker is used, so it is declared here explicitly.
tracking = [
    "ultralytics>=8.4,<9",
    "lap>=0.5.12,<0.6",
]
# ONNX export and validation (install together with `detector`, which provides
# Ultralytics and PyTorch, and ONE of the runtime extras below). These are the
# packages Ultralytics' ONNX exporter checks for: onnx always; onnxslim and an
# ONNX Runtime package when simplifying (the default). Ultralytics would
# pip-install any that are missing at export time, so EdgeVision checks first.
# ONNX Runtime is not listed here, so that GPU users are not forced to also
# install the CPU package (the two conflict).
export = [
    "onnx>=1.12,<2",
    "onnxslim>=0.1.82,<0.2",
]
# ONNX Runtime inference (`--backend onnx`), CPU build. Works everywhere and
# is what a machine without an NVIDIA GPU needs. Use with `vision` (OpenCV is
# used to resize frames).
onnxruntime = [
    "onnxruntime>=1.20,<2",
]
# ONNX Runtime inference on NVIDIA GPUs (also includes the CPU provider).
# INSTALL ONLY ONE of `onnxruntime` and `onnxruntime-gpu`: both provide the
# same `onnxruntime` module and overwrite each other. Needs matching CUDA and
# cuDNN libraries; see the ONNX Runtime documentation for your release.
onnxruntime-gpu = [
    "onnxruntime-gpu>=1.20,<2",
]

[tool.setuptools.dynamic]
version = { attr = "edgevision.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"   # summarise skipped/failed tests at the end of every run
markers = [
    "model: runs a real pretrained model; opt-in with EDGEVISION_RUN_MODEL_TESTS=1",
]
