[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgevision"
dynamic = ["version"]   # read from edgevision.__version__ (single source of truth)
description = "Video perception pipeline and reproducible PyTorch vs ONNX Runtime inference benchmarking (early development)."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Only what the implemented code needs. Heavy ML packages (PyTorch, ONNX
# Runtime, OpenCV, Ultralytics) are deliberately NOT mandatory: the
# environment report treats them as optional and they will be added, with
# CPU and GPU variants kept separate, in the stages that actually use them.
dependencies = [
    "pyyaml>=6.0.1,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
]

[tool.setuptools.dynamic]
version = { attr = "edgevision.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"   # summarise skipped/failed tests at the end of every run
